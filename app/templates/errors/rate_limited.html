{% extends "base.html" %}
{% block title %}คำขอมากเกินไป — SmartCheck{% endblock %}

{% block content %}
<div class="max-w-md mx-auto pt-6">
    <article class="pass{% if session.get('user_role') != 'student' %} pass-on-light{% endif %}" aria-labelledby="rl-title">
        <div class="pass-band" data-state="closed"><span>รอสักครู่</span><span>429</span></div>
        <div class="pass-body">
            <h1 id="rl-title" class="pass-code" style="font-size:24px">คำขอมากเกินไป</h1>
            <p class="pass-name mt-1">ระบบรับคำขอจากเครื่องนี้ถี่เกินไป กรุณารอสักครู่แล้วลองใหม่อีกครั้ง</p>
        </div>
        <div class="pass-perf" aria-hidden="true"></div>
        <div class="pass-foot">
            <a href="{{ request.full_path }}" class="btn-board">ลองใหม่</a>
        </div>
    </article>
</div>
{% endblock %}
